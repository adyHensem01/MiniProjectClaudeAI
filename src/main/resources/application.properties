spring.application.name=weddingPackage

# Load secrets/settings from a local .env file (KEY=value format). The file is git-ignored.
# Real environment variables also work and take precedence.
spring.config.import=optional:file:.env[.properties]

# ---------- Claude API ----------
# The key is NEVER written here - it comes from .env or the environment.
claude.api-key=${ANTHROPIC_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-opus-5-5}
claude.max-tokens=${CLAUDE_MAX_TOKENS:8000}
claude.timeout-seconds=${CLAUDE_TIMEOUT_SECONDS:60}
claude.max-retries=${CLAUDE_MAX_RETRIES:2}

# ---------- MongoDB ----------
# serverSelectionTimeoutMS keeps the API from hanging for 30s when MongoDB is down.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/?serverSelectionTimeoutMS=5000}
# Database name is set separately so Atlas URIs without a /dbname part still work.
spring.mongodb.database=${MONGODB_DATABASE:wedding_planner}

# Seed sample_data/wedding_packages.json on startup.
# SEED_RESET=true clears packages AND consultations first (like the Python seed script's --reset).
app.seed.reset=${SEED_RESET:false}

# Don't leak stack traces to API clients
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
